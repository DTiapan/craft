# Craft dependency manifest — reference only, no vendored skill bodies
# Router (using-craft) resolves skills by name from local install paths.

version: "0.2.2"

profiles:
  global:
    name: "Global Baseline Engineering"
    description: "Core process foundation for every project"
    sources:
      - addyosmani/agent-skills
    skills:
      - test-driven-development
      - debugging-and-error-recovery
      - code-review-and-quality
      - constraint-driven-development
      - git-workflow-and-versioning
      - documentation-and-adrs
      - context-engineering

  saas:
    name: "SaaS & Commercial Product Engine"
    description: "Skills for billing, multi-tenancy, SEO, marketing, and entitlements"
    sources:
      - addyosmani/agent-skills
      - nextlevelbuilder/ui-ux-pro-max-skill
    skills:
      - api-and-interface-design
      - security-and-hardening
      - frontend-ui-engineering
      - ci-cd-and-automation
      - shipping-and-launch
      - ui-ux-pro-max

  engineering:
    name: "Core Software Engineering & System Design"
    description: "Skills for system design, API contracts, architecture ADRs, TDD, security, and ops"
    sources:
      - addyosmani/agent-skills
    skills:
      - api-and-interface-design
      - spec-driven-development
      - documentation-and-adrs
      - constraint-driven-development
      - test-driven-development
      - security-and-hardening
      - observability-and-instrumentation
      - performance-optimization
      - ci-cd-and-automation
      - git-workflow-and-versioning
      - debugging-and-error-recovery
      - code-review-and-quality
      - code-simplification
      - incremental-implementation

  product:
    name: "Product Strategy & Discovery"
    description: "Skills for 0 to 1 product discovery, PRDs, user interviews, and capability mapping"
    sources:
      - addyosmani/agent-skills
    skills:
      - idea-refine
      - interview-me
      - spec-driven-development
      - planning-and-task-breakdown
      - documentation-and-adrs

  uiux:
    name: "UI/UX & Frontend Excellence"
    description: "Skills for design systems, modern web APIs, responsive UI, and accessibility"
    sources:
      - addyosmani/agent-skills
      - nextlevelbuilder/ui-ux-pro-max-skill
    skills:
      - ui-ux-pro-max
      - frontend-ui-engineering
      - browser-testing-with-devtools
      - modern-web-guidance

  marketing:
    name: "Growth & Copywriting"
    description: "Skills for product launch, user messaging, and conversion optimization"
    sources:
      - addyosmani/agent-skills
    skills:
      - shipping-and-launch
      - idea-refine
      - interview-me
      - spec-driven-development

  seo:
    name: "SEO & Web Performance"
    description: "Skills for technical SEO, metadata, Core Web Vitals, and search ranking"
    sources:
      - addyosmani/agent-skills
      - modern-web-guidance-plugin
    skills:
      - performance-optimization
      - modern-web-guidance
      - browser-testing-with-devtools

fallback:
  auto_search_online: true
  search_command: "npx skills add {query}"
  git_fallback: "git clone {url} ~/.agents/skills/{name}"
  registry_url: "https://github.com/addyosmani/agent-skills"

dependencies:
  - id: addyosmani/agent-skills
    install: "npx skills add addyosmani/agent-skills"
    update: "npx skills update addyosmani/agent-skills"
    install_note: "Run from your project root so skills land in .agents/skills/"
    local_paths:
      - ".agents/skills"
      - "~/.agents/skills"
      - "~/.cursor/skills"
    skills:
      - interview-me
      - idea-refine
      - spec-driven-development
      - documentation-and-adrs
      - planning-and-task-breakdown
      - incremental-implementation
      - test-driven-development
      - debugging-and-error-recovery
      - code-review-and-quality
      - constraint-driven-development
      - security-and-hardening
      - frontend-ui-engineering
      - ci-cd-and-automation
      - shipping-and-launch
      - git-workflow-and-versioning
      - context-engineering
      - code-simplification
      - performance-optimization
      - api-and-interface-design
    optional_skills:
      - implement
      - diagnose
      - domain-modeling
      - codebase-design
      - doubt-driven-development
      - observability-and-instrumentation
      - deprecation-and-migration
      - browser-testing-with-devtools
      - source-driven-development

  - id: cursor-superpowers
    optional: true
    note: "Installed via Cursor Superpowers plugin; not npx-installable"
    skills:
      - brainstorming
      - systematic-debugging
      - verification-before-completion

craft_native:
  - using-craft
  - engineering-ledger
  - craft-adopt
  - craft-promote
